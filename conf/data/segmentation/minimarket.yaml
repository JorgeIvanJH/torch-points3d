# @package data
task: segmentation
class: minimarket.MiniMarketDataset
dataroot: data
first_subsampling: 0.01
use_category: False
class_weight_method:  # options: "log", "sqrt", none

# NEW voxelization options
voxel_sizes: [0.02, 0.03]       # in meters — one or more sizes
min_points_per_voxel: 64        # ignore very small voxels
normalize_in_voxel: true        # shift coords to voxel-local frame

train_transforms:
  - transform: XYZFeature
    params:
      add_x: False
      add_y: False
      add_z: True
  - transform: AddFeatsByKeys
    params:
      list_add_to_x: [True, True]
      feat_names: [rgb, pos_z]
      delete_feats: [True, True]
  - transform: Center

test_transform:
  - transform: XYZFeature
    params:
      add_x: False
      add_y: False
      add_z: True
  - transform: AddFeatsByKeys
    params:
      list_add_to_x: [True, True]
      feat_names: [rgb, pos_z]
      delete_feats: [True, True]
  - transform: Center

val_transform: ${data.test_transform}
